name: Validate

on:
  push:
  pull_request:

# The default for every job below. A job that needs more declares it itself;
# an explicit floor here means a new job cannot silently inherit an org
# setting somebody widened.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: "3.9"

      - name: Installers are valid bash
        run: bash -n install.sh install-codex.sh

      - name: Plugin manifest is valid JSON
        run: jq empty .claude-plugin/plugin.json

      - name: SKILL.md has name and description frontmatter
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          ok = True
          for skill in sorted(pathlib.Path("skills").glob("*/SKILL.md")):
              text = skill.read_text(encoding="utf-8")
              match = re.match(r"^---\n(.*?)\n---", text, re.S)
              if not match:
                  print(f"{skill}: no frontmatter")
                  ok = False
                  continue
              for key in ("name:", "description:"):
                  if key not in match.group(1):
                      print(f"{skill}: missing {key}")
                      ok = False
          sys.exit(0 if ok else 1)
          PY

      - name: No em or en dashes
        run: |
          if grep -rn '[—–]' --include='*.md' --include='*.py' .; then
            echo "House style is a plain hyphen."
            exit 1
          fi

      - name: The four rules hold
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest skills/pairwork/tests -q
